<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Casimir Systems — Aligning Private Capital with National Security</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
  <script type="text/babel" src="cs-components.jsx"></script>
  <script type="text/babel" src="cs-pages.jsx"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "theme": "clarity",
  "accentColor": "#2563EB",
  "heroLayout": "split",
  "fontScale": 1
}/*EDITMODE-END*/;

function App() {
  const [page, setPage] = React.useState(() => {
    return localStorage.getItem('cs_page') || 'home';
  });
  const [tweaks, setTweaks] = React.useState(TWEAK_DEFAULTS);
  const [tweaksOpen, setTweaksOpen] = React.useState(false);

  const navigate = (p) => {
    setPage(p);
    localStorage.setItem('cs_page', p);
    window.scrollTo({ top: 0, behavior: 'smooth' });
  };

  // Tweaks host protocol
  React.useEffect(() => {
    const handler = (e) => {
      if (e.data?.type === '__activate_edit_mode') setTweaksOpen(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksOpen(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const setTweak = (key, value) => {
    const next = { ...tweaks, [key]: value };
    setTweaks(next);
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: next }, '*');
  };

  // Apply theme CSS vars
  React.useEffect(() => {
    const root = document.documentElement;
    root.style.setProperty('--blue', tweaks.accentColor);
    if (tweaks.theme === 'deep-space') {
      document.body.style.background = '#0B132B';
    } else if (tweaks.theme === 'clarity') {
      document.body.style.background = '#F8FAFC';
    } else {
      document.body.style.background = '#F8FAFC';
    }
  }, [tweaks]);

  const pages = { home: HomePage, platform: PlatformPage, solutions: SolutionsPage, about: AboutPage, resources: ResourcesPage, contact: ContactPage };
  const PageComponent = pages[page] || HomePage;

  return (
    <div style={{ fontSize: `${(tweaks.fontScale || 1) * 100}%` }}>
      <CasimirNav currentPage={page} onNavigate={navigate} />
      <main style={{ paddingTop: 0 }}>
        <PageComponent onNavigate={navigate} theme={tweaks.theme} />
      </main>
      <CasimirFooter onNavigate={navigate} />

      {/* Tweaks Panel */}
      {tweaksOpen && (
        <div style={{
          position: 'fixed', bottom: 24, right: 24, width: 300, zIndex: 9999,
          background: '#fff', borderRadius: 14, boxShadow: '0 24px 64px rgba(0,0,0,0.2), 0 4px 16px rgba(0,0,0,0.1)',
          border: '1px solid #E2E8F0', overflow: 'hidden', fontFamily: 'IBM Plex Sans, sans-serif',
        }}>
          <div style={{ background: '#0B132B', padding: '14px 18px', display: 'flex', alignItems: 'center', justifyContent: 'space-between' }}>
            <span style={{ fontSize: 13, fontWeight: 600, color: '#fff', letterSpacing: '0.04em', fontFamily: 'Inter, sans-serif' }}>Tweaks</span>
            <button onClick={() => setTweaksOpen(false)}
              style={{ background: 'none', border: 'none', color: 'rgba(255,255,255,0.5)', cursor: 'pointer', fontSize: 18, lineHeight: 1, padding: 0 }}>×</button>
          </div>
          <div style={{ padding: 18, display: 'flex', flexDirection: 'column', gap: 20 }}>

            {/* Theme */}
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#64748B', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>Visual Theme</div>
              <div style={{ display: 'flex', flexDirection: 'column', gap: 6 }}>
                {[
                  { id: 'illuminated', label: 'Illuminated Intelligence', sub: 'Dark nav · Light content (default)' },
                  { id: 'deep-space', label: 'Deep Space', sub: 'Full dark mode' },
                  { id: 'clarity', label: 'Clarity', sub: 'Light & airy, SaaS-forward' },
                ].map(t => (
                  <button key={t.id} onClick={() => setTweak('theme', t.id)}
                    style={{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start',
                      padding: '9px 12px', borderRadius: 8, border: `1.5px solid ${tweaks.theme === t.id ? '#2563EB' : '#E2E8F0'}`,
                      background: tweaks.theme === t.id ? 'rgba(37,99,235,0.05)' : '#fff',
                      cursor: 'pointer', textAlign: 'left', transition: 'all 0.15s' }}>
                    <span style={{ fontSize: 13, fontWeight: 500, color: tweaks.theme === t.id ? '#2563EB' : '#334155' }}>{t.label}</span>
                    <span style={{ fontSize: 11, color: '#94A3B8', marginTop: 1 }}>{t.sub}</span>
                  </button>
                ))}
              </div>
            </div>

            {/* Accent color */}
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#64748B', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>Accent Color</div>
              <div style={{ display: 'flex', gap: 8 }}>
                {[
                  { color: '#2563EB', label: 'Signal Blue' },
                  { color: '#0EA5E9', label: 'Sky Blue' },
                  { color: '#6366F1', label: 'Indigo' },
                  { color: '#10B981', label: 'Verified Green' },
                  { color: '#0B132B', label: 'Navy' },
                ].map(c => (
                  <button key={c.color} onClick={() => setTweak('accentColor', c.color)}
                    title={c.label}
                    style={{ width: 28, height: 28, borderRadius: '50%', background: c.color, border: 'none',
                      cursor: 'pointer', outline: tweaks.accentColor === c.color ? `3px solid ${c.color}` : 'none',
                      outlineOffset: 2, transition: 'outline 0.15s' }} />
                ))}
              </div>
            </div>

            {/* Navigation */}
            <div>
              <div style={{ fontSize: 11, fontWeight: 600, color: '#64748B', letterSpacing: '0.1em', textTransform: 'uppercase', marginBottom: 10 }}>Jump to Page</div>
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 6 }}>
                {[['home','Home'],['platform','Platform'],['solutions','Solutions'],['about','About'],['resources','Resources'],['contact','Contact']].map(([id, label]) => (
                  <button key={id} onClick={() => navigate(id)}
                    style={{ padding: '7px 10px', borderRadius: 7, border: `1px solid ${page === id ? '#2563EB' : '#E2E8F0'}`,
                      background: page === id ? 'rgba(37,99,235,0.06)' : '#fff',
                      fontSize: 12, fontWeight: page === id ? 600 : 400,
                      color: page === id ? '#2563EB' : '#64748B', cursor: 'pointer',
                      fontFamily: 'IBM Plex Sans, sans-serif' }}>
                    {label}
                  </button>
                ))}
              </div>
            </div>

            {/* Font scale */}
            <div>
              <div style={{ display: 'flex', justifyContent: 'space-between', marginBottom: 8 }}>
                <span style={{ fontSize: 11, fontWeight: 600, color: '#64748B', letterSpacing: '0.1em', textTransform: 'uppercase' }}>Type Scale</span>
                <span style={{ fontSize: 11, color: '#94A3B8' }}>{Math.round(tweaks.fontScale * 100)}%</span>
              </div>
              <input type="range" min={0.85} max={1.15} step={0.05} value={tweaks.fontScale}
                onChange={e => setTweak('fontScale', parseFloat(e.target.value))}
                style={{ width: '100%', accentColor: tweaks.accentColor }} />
            </div>

          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
