# Weekly opportunity scan.
#
# Runs the Casimir Opportunity Scanner every Monday at 13:00 UTC
# (7am Denver in summer / 6am in winter), commits the dated briefing and
# seen-state to the repo, and opens a GitHub issue with the report — the
# issue notification email is how you know the scan ran.
#
# Setup: add SAM_GOV_API_KEY as a repository secret
# (Settings > Secrets and variables > Actions) to include the SAM.gov
# broad sweep and NRO-filtered queries. The scan still runs without it and
# reports those sources as SKIPPED.
#
# Direct email: the briefing is emailed to ryanwinzenburg@gmail.com through
# Resend, reusing the same RESEND_API_KEY and verified casimirsystems.com
# sending domain as the site's contact form. Add RESEND_API_KEY as a
# repository secret; without it the email step is skipped and the GitHub
# issue notification remains the delivery channel.

name: Weekly opportunity scan

on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

concurrency:
  group: opportunity-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: opportunity-scanner
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: opportunity-scanner/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scan
        env:
          SAM_GOV_API_KEY: ${{ secrets.SAM_GOV_API_KEY }}
        run: python scripts/scan_opportunities.py

      - name: Read scan summary
        id: summary
        run: |
          {
            echo "date=$(jq -r .date reports/latest-summary.json)"
            echo "new=$(jq -r .new reports/latest-summary.json)"
            echo "hubzone=$(jq -r .hubzone reports/latest-summary.json)"
            echo "core=$(jq -r .core reports/latest-summary.json)"
            echo "secondary=$(jq -r .secondary reports/latest-summary.json)"
            echo "report=$(jq -r .report reports/latest-summary.json)"
          } >> "$GITHUB_OUTPUT"

      - name: Commit report and seen-state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "Nothing changed since the last scan — no commit."
            exit 0
          fi
          git commit -m "Opportunity scan ${{ steps.summary.outputs.date }}: ${{ steps.summary.outputs.new }} new"

          # main can move between checkout and push (e.g. a PR merging
          # while this job is running) — rebase and retry instead of
          # failing the whole scan on a plain non-fast-forward rejection.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5) — main moved, rebasing onto origin/main and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              echo "::error::Rebase onto origin/main hit a real conflict — aborting so the report/seen-state aren't left in a broken state. Check reports/ for merge markers on the next manual run."
              git rebase --abort
              exit 1
            fi
            sleep $((attempt * 3))
          done
          echo "::error::Failed to push after 5 attempts."
          exit 1

      # Notification steps below use if: steps.summary.outcome == 'success'
      # rather than the default "only if all previous steps succeeded" —
      # a git push race (main moving mid-run) shouldn't also silently
      # swallow the issue and email notifications when the scan itself and
      # the report both completed fine. Report content still lands in the
      # job summary/artifact-equivalent output even if the commit later
      # gets retried or needs a manual push.
      - name: Open briefing issue
        if: ${{ steps.summary.outcome == 'success' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "Opportunity scan ${{ steps.summary.outputs.date }} — ${{ steps.summary.outputs.new }} new, ${{ steps.summary.outputs.hubzone }} HUBZone, ${{ steps.summary.outputs.core }} core match(es)" \
            --body-file "${{ steps.summary.outputs.report }}"

      - name: Email briefing via Resend
        if: ${{ steps.summary.outcome == 'success' }}
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python scripts/send_report_email.py

      - name: Job summary
        if: ${{ steps.summary.outcome == 'success' }}
        run: cat "${{ steps.summary.outputs.report }}" >> "$GITHUB_STEP_SUMMARY"
