# Keyword groups used to score each opportunity's relevance to Casimir.
# Each group has a weight (relative importance) and a list of keywords/phrases
# (case-insensitive substring match against title + description).
# score.py sums weighted hits, normalizes to 0-100, and returns matched tags.

groups:
  - tag: core_platform
    weight: 3.0
    description: "Direct match to Casimir Intelligence's core function"
    keywords:
      - "ecosystem mapping"
      - "co-investment"
      - "decision support"
      - "S&T"
      - "science and technology"
      - "technology scouting"
      - "portfolio analysis"
      - "investment decision"

  - tag: ai_intel_synthesis
    weight: 2.5
    description: "AI for intelligence synthesis — Dave's flagged priority; human-in-the-loop required"
    keywords:
      - "intelligence synthesis"
      - "target analysis"
      - "targeting cycle"
      - "human-in-the-loop"
      - "human in the loop"
      - "analyst workflow"
      - "all-source intelligence"
      - "ISR"
      - "PED" # processing, exploitation, dissemination
      - "SIGINT"
      - "ELINT"
      - "GEOINT"

  - tag: data_viz_human_factors
    weight: 2.5
    description: "Sensor/data overload distillation — Dave's flagged priority"
    keywords:
      - "data visualization"
      - "human factors"
      - "common operating picture"
      - "unified operating picture"
      - "command and control"
      - "C2"
      - "sensor fusion"
      - "decision fatigue"
      - "analysis paralysis"
      - "dashboard"

  - tag: unmanned_platforms
    weight: 2.0
    description: "UAS/USV/UGV integration — Dave's flagged priority"
    keywords:
      - "unmanned aerial"
      - "UAS"
      - "unmanned ground"
      - "UGV"
      - "unmanned surface"
      - "USV"
      - "drone"
      - "counter-UAS"
      - "c-UAS"
      - "autonomous platform"
      # phrasing actually used on SOFWERX/DIU/xTech pages (verified July 2026):
      - "unmanned systems"
      - "unmanned platform"
      - "unmanned platforms"
      - "autonomous systems"
      - "autonomous solutions"
      - "uncrewed"
      - "UxS"
      - "UxV"

  - tag: power_battery
    weight: 1.5
    description: "Battery/power management for field tech — Dave's flagged priority"
    keywords:
      - "battery management"
      - "power management"
      - "soldier-worn"
      - "wearable power"
      - "field power"
      - "energy storage"

  - tag: counter_ai_influence
    weight: 1.5
    description: "Counter-AI and influence operations — Dave's flagged priority"
    keywords:
      - "counter-AI"
      - "adversarial AI"
      - "influence operations"
      - "information operations"
      - "disinformation"
      - "deception"

  - tag: data_center_siting
    weight: 1.0
    description: "Rural-West data center siting / water rights / aquifer remediation — ties to Ryan's hydrogeology background"
    keywords:
      - "data center siting"
      - "water rights"
      - "aquifer"
      - "groundwater remediation"
      - "hydrogeology"
      - "environmental remediation"

  - tag: compliance_relevant
    weight: 1.0
    description: "Signals the topic cares about the same compliance bar Casimir already targets"
    keywords:
      - "NIST 800-171"
      - "CMMC"
      - "CUI"
      - "controlled unclassified information"
      - "FOUO"

  - tag: sbir_sttr_cycle
    weight: 2.0
    description: >
      Mechanism signal: SBIR/STTR cycle releases and announcements. A SOFWERX
      "SBIR 26.x Release N" card carries no capability keywords but is exactly
      the early-warning SOCOM signal this scanner exists to catch — this group
      guarantees such items clear the report threshold.
    keywords:
      - "SBIR"
      - "STTR"
      - "small business innovation research"
      - "small business technology transfer"
      - "direct-to-phase"
      - "D2P2"

  - tag: set_aside_signal
    weight: 0.5
    description: "Not a capability match, but flags set-aside eligibility worth noting per Dave's comments"
    keywords:
      - "woman-owned"
      - "women-owned"
      - "service-disabled veteran"
      - "SDVOSB"
      - "HUBZone"
      - "8(a)"

# Minimum normalized score (0-100) for an item to appear in the report at all.
# Items below this are dropped rather than cluttering the briefing.
# Calibration note (July 2026): one full hit on a weight-2.0 group normalizes
# to ~9, and on a weight-2.5 group to ~11 — so a threshold of 8 keeps every
# single-strong-group match (e.g. a SOCOM unmanned-systems assessment event)
# while still dropping zero-match noise. Raise it if reports get cluttered.
minimum_score_threshold: 8
