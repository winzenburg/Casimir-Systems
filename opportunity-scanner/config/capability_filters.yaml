# Keyword groups used to score each opportunity's relevance to Casimir.
#
# tier: core      — matches Ryan's actual differentiated skill set: AI-native
#                    rapid software delivery, UX/human factors for high-stakes
#                    or sensitive domains, business/product strategy, and the
#                    Casimir Intelligence platform itself. Proven across
#                    Winzinvest (fintech execution software), Kinlet.care
#                    (sensitive-context caregiver community UX), and Casimir.
#                    An opportunity needs at least one CORE tag to appear in
#                    the main report at all — see minimum_score_threshold and
#                    scan_opportunities.py's core-gate logic.
# tier: secondary  — Dave's flagged defense-market opportunity areas (battery,
#                    unmanned platforms, counter-AI, etc.). Real market intel,
#                    but not a capability match by themselves — a topic that
#                    only hits a secondary tag is shown in a separate
#                    "market intel, no direct capability match" section
#                    rather than mixed into the main ranked list.
#
# Each group has a weight (relative importance within its tier) and a list of
# keywords/phrases (case-insensitive, word-boundary match against title +
# description). score.py sums weighted hits per tier, normalizes to 0-100,
# and returns matched tags + which tier(s) were hit.

groups:
  # ---- CORE: matches Ryan's actual differentiated skill set ----

  - tag: core_platform
    tier: core
    weight: 3.0
    description: "Direct match to Casimir Intelligence's core function"
    keywords:
      - "ecosystem mapping"
      - "co-investment"
      - "decision support"
      - "S&T"
      - "science and technology"
      - "technology scouting"
      - "portfolio analysis"
      - "investment decision"

  - tag: ai_workflows
    tier: core
    weight: 2.5
    description: "AI workflows / agentic systems — the actual build capability behind Casimir, Winzinvest, and Kinlet"
    keywords:
      - "AI workflow"
      - "agentic"
      - "large language model"
      - "LLM"
      - "generative AI"
      - "AI automation"
      - "AI-native"
      - "autonomous agent"
      - "workflow automation"
      - "retrieval augmented generation"
      - "human-in-the-loop"
      - "human in the loop"

  - tag: ux_human_factors
    tier: core
    weight: 2.5
    description: "UX/UI/human factors, especially for high-stakes or sensitive-context tools — the throughline from Kinlet's caregiver UX to analyst-facing dashboards"
    keywords:
      - "user experience"
      - "human factors"
      - "human-centered design"
      - "user-centered design"
      - "information architecture"
      - "usability"
      - "human systems"
      - "human performance"
      - "trust and safety"
      - "data visualization"
      - "common operating picture"
      - "unified operating picture"
      - "dashboard"
      - "sensor fusion"
      - "decision fatigue"
      - "analysis paralysis"
      - "C2" # command and control

  - tag: rapid_ai_native_development
    tier: core
    weight: 2.0
    description: "Rapid, AI-accelerated software delivery — building with tools like Cursor rather than traditional multi-year dev cycles"
    keywords:
      - "rapid prototyping"
      - "rapid development"
      - "low-code"
      - "no-code"
      - "AI-assisted development"
      - "AI-accelerated"
      - "software factory"
      - "DevSecOps"
      - "continuous delivery"
      - "minimum viable product"
      - "MVP"

  - tag: business_strategy_product
    tier: core
    weight: 1.5
    description: "Product/business strategy signal — distinguishes 'we want a vendor who thinks about product' topics from pure engineering asks"
    keywords:
      - "product strategy"
      - "go-to-market"
      - "software-as-a-service"
      - "SaaS"
      - "productized"
      - "commercial off-the-shelf software"

  - tag: data_center_siting
    tier: core
    weight: 1.5
    description: "Rural-West data center siting / water rights / aquifer remediation — Ryan's hydrogeology background"
    keywords:
      - "data center siting"
      - "water rights"
      - "aquifer"
      - "groundwater remediation"
      - "hydrogeology"
      - "environmental remediation"

  # ---- SECONDARY: Dave's flagged market areas — real intel, not a capability match by itself ----

  - tag: ai_intel_synthesis
    tier: secondary
    weight: 2.0
    description: "AI for intelligence synthesis — Dave's flagged priority"
    keywords:
      - "intelligence synthesis"
      - "target analysis"
      - "targeting cycle"
      - "analyst workflow"
      - "all-source intelligence"
      - "ISR"
      - "PED" # processing, exploitation, dissemination
      # INT discipline names actually used on SOFWERX/DIU pages (verified July 2026):
      - "SIGINT"
      - "ELINT"
      - "GEOINT"

  - tag: unmanned_platforms
    tier: secondary
    weight: 1.5
    description: "UAS/USV/UGV integration — Dave's flagged priority"
    keywords:
      - "unmanned aerial"
      - "UAS"
      - "unmanned ground"
      - "UGV"
      - "unmanned surface"
      - "USV"
      - "drone"
      - "counter-UAS"
      - "c-UAS"
      - "autonomous platform"
      # phrasing actually used on SOFWERX/DIU/xTech pages (verified July 2026):
      - "unmanned systems"
      - "unmanned platform"
      - "unmanned platforms"
      - "autonomous systems"
      - "autonomous solutions"
      - "uncrewed"
      - "UxS"
      - "UxV"

  - tag: power_battery
    tier: secondary
    weight: 1.0
    description: "Battery/power management for field tech — Dave's flagged priority"
    keywords:
      - "battery management"
      - "power management"
      - "soldier-worn"
      - "wearable power"
      - "field power"
      - "energy storage"

  - tag: counter_ai_influence
    tier: secondary
    weight: 1.0
    description: "Counter-AI and influence operations — Dave's flagged priority"
    keywords:
      - "counter-AI"
      - "adversarial AI"
      - "influence operations"
      - "information operations"
      - "disinformation"
      - "deception"

  - tag: compliance_relevant
    tier: secondary
    weight: 0.5
    description: "Signals the topic cares about the same compliance bar Casimir already targets"
    keywords:
      - "NIST 800-171"
      - "CMMC"
      - "CUI"
      - "controlled unclassified information"
      - "FOUO"

  - tag: sbir_sttr_cycle
    tier: secondary
    weight: 1.5
    description: >
      Mechanism signal: SBIR/STTR cycle releases and announcements. A SOFWERX
      "SBIR 26.x Release N" card carries no capability keywords but is the
      early-warning SOCOM signal worth knowing about — it surfaces in the
      market-intel section, where a human decides whether the topics fit.
    keywords:
      - "SBIR"
      - "STTR"
      - "small business innovation research"
      - "small business technology transfer"
      - "direct-to-phase"
      - "D2P2"

  - tag: set_aside_signal
    tier: secondary
    weight: 0.5
    description: >
      Keyword-only mention of a socioeconomic set-aside Casimir does NOT
      (yet) qualify for — WOSB/EDWOSB, SDVOSB, 8(a). Flags market intel, not
      a real angle for Casimir. NOTE: HUBZone is intentionally NOT a keyword
      here — Casimir's principal office IS HUBZone-eligible, so HUBZone
      opportunities get a much stronger, structural signal via
      sam_gov.fetch_hubzone() (SAM.gov's official typeOfSetAside=HZC/HZS
      field) and appear in their own report section, unconditionally, rather
      than depending on a text match. See scripts/sources/sam_gov.py.
    keywords:
      - "woman-owned"
      - "women-owned"
      - "service-disabled veteran"
      - "SDVOSB"
      - "8(a)"

# Minimum normalized score (0-100, computed within whichever tier(s) an item
# matched) for an item to appear in the report at all.
# Calibration note (July 2026): scores normalize within the matched tier, so
# one full hit on a weight-2.5 core group ≈ 13.5, on a weight-1.5 secondary
# group ≈ 13 — a threshold of 10 keeps every single-strong-group match while
# dropping zero-match noise. Raise it if reports get cluttered.
minimum_score_threshold: 10

# If true, an opportunity must match at least one CORE tag to appear in the
# main report. Secondary-only matches (Dave's flagged areas with zero core
# hits) are still surfaced, but in a separate "market intel" section rather
# than the main ranked list — so you don't lose the signal, but it doesn't
# crowd out actual capability matches.
require_core_match_for_main_list: true
